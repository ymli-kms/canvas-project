<!DOCTYPE html>

<head>

    <style>
        body {
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #fef3c7 100%);
            user-select: none;
            -webkit-user-select: none;

        .bubble-circle {
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.25);
        }

        .bubble-circle:hover {

        }

        .drag-ball {
            cursor: grab;
            touch-action: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .drag-ball:active, .drag-ball.dragging {
            cursor: grabbing;
            transform: scale(1.15);
            box-shadow: 0 12px 24px rgba(0,0,0,0.25);
            z-index: 50;
        }

        .drop-zone {
            transition: all 0.2s ease;
        }

        .drop-zone.drag-over {
            background-color: #fef08a !important;
            border-color: #f59e0b !important;
            transform: scale(1.08);
        }

        @keyframes bounce-short {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .bounce-anim {
            animation: bounce-short 0.4s ease 2;
        }

        .keypad-btn {
            touch-action: manipulation;
        }

    <script>
        class SoundEffects {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        this.ctx = new AudioContext();
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playPop() {
                try {
                    this.init();
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.08);
                } catch (e) {
                    console.warn('Audio playPop error:', e);
                }
            }

            playCorrect() {
                try {
                    this.init();
                    if (!this.ctx) return;
                    const now = this.ctx.currentTime;
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                        gain.gain.setValueAtTime(0.2, now + idx * 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.2);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now + idx * 0.08);
                        osc.stop(now + idx * 0.08 + 0.2);
                    });
                } catch (e) {
                    console.warn('Audio playCorrect error:', e);
                }
            }

            playWrong() {
                try {
                    this.init();
                    if (!this.ctx) return;
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.setValueAtTime(160, now + 0.15);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } catch (e) {
                    console.warn('Audio playWrong error:', e);
                }
            }
        }

        const sound = new SoundEffects();

        class NumberBondGame {
            constructor() {
                this.maxNumber = 19;
                this.score = 0;
                
                this.total = 0;
                this.part1 = 0;
                this.part2 = 0;
                this.blankNode = '';
                this.targetAnswer = 0;

                this.selectedBallValue = null;
                this.selectedBallElement = null;
                this.selectedBallNodeKey = null;

                // Store object { val: number, nodeKey: string } in slots
                this.equationState = {
                    add: [null, null, null],
                    sub: [null, null, null]
                };

                this.nodeValues = {
                    top: 0,
                    left: 0,
                    right: 0
                };

                this.nodeVisibility = {
                    top: true,
                    left: true,
                    right: true
                };

                this.isAddCompleted = false;
                this.isSubCompleted = false;

                this.init();
            }

            init() {
                this.setupDropZoneEvents();
                this.initWhiteboard();
                this.nextQuestion();
            }

            initWhiteboard() {
                const canvas = document.getElementById('whiteboard-canvas');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let isDrawing = false;

                const setupCanvasSize = () => {
                    const rect = canvas.getBoundingClientRect();
                    if (rect.width && rect.height) {
                        canvas.width = rect.width;
                        canvas.height = rect.height;
                        ctx.strokeStyle = '#0284c7';
                        ctx.lineWidth = 4;
                        ctx.lineCap = 'round';
                        ctx.lineJoin = 'round';
                    }
                };

                setupCanvasSize();
                window.addEventListener('resize', setupCanvasSize);

                const getPos = (e) => {
                    const rect = canvas.getBoundingClientRect();
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    return {
                        x: (clientX - rect.left) * (canvas.width / rect.width),
                        y: (clientY - rect.top) * (canvas.height / rect.height)
                    };
                };

                const startDraw = (e) => {
                    isDrawing = true;
                    ctx.beginPath();
                    const pos = getPos(e);
                    ctx.moveTo(pos.x, pos.y);
                };

                const draw = (e) => {
                    if (!isDrawing) return;
                    const pos = getPos(e);
                    ctx.lineTo(pos.x, pos.y);
                    ctx.stroke();
                };

                const stopDraw = () => {
                    isDrawing = false;
                };

                canvas.addEventListener('mousedown', startDraw);
                canvas.addEventListener('mousemove', draw);
                window.addEventListener('mouseup', stopDraw);

                canvas.addEventListener('touchstart', (e) => { startDraw(e); }, { passive: true });
                canvas.addEventListener('touchmove', (e) => { draw(e); }, { passive: true });
                canvas.addEventListener('touchend', stopDraw);
            }

            clearWhiteboard() {
                sound.playPop();
                const canvas = document.getElementById('whiteboard-canvas');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }

            changeDifficulty() {
                const select = document.getElementById('difficulty-select');
                this.maxNumber = parseInt(select.value, 10);
                this.nextQuestion();
            }

            generateQuestion() {
                const upperLimit = Math.min(this.maxNumber, 19);
                this.total = Math.floor(Math.random() * (upperLimit - 1)) + 2;
                
                this.part1 = Math.floor(Math.random() * (this.total - 1)) + 1;
                this.part2 = this.total - this.part1;

                this.nodeValues = {
                    top: this.total,
                    left: this.part1,
                    right: this.part2
                };

                const options = ['top', 'left', 'right'];
                this.blankNode = options[Math.floor(Math.random() * options.length)];

                if (this.blankNode === 'top') {
                    this.targetAnswer = this.total;
                } else if (this.blankNode === 'left') {
                    this.targetAnswer = this.part1;
                } else {
                    this.targetAnswer = this.part2;
                }
            }

            renderStage1() {
                this.clearWhiteboard();
                document.getElementById('step1-badge').children[0].className = 'w-10 h-10 rounded-full bg-amber-500 text-white font-black flex items-center justify-center shadow-lg text-lg border-4 border-white';
                document.getElementById('step1-badge').children[1].className = 'text-xs font-bold text-amber-600 mt-1';
                document.getElementById('step2-badge').children[0].className = 'w-10 h-10 rounded-full bg-slate-300 text-slate-600 font-black flex items-center justify-center shadow-md text-lg border-4 border-white';
                document.getElementById('step2-badge').children[1].className = 'text-xs font-bold text-slate-400 mt-1';
                document.getElementById('step-line-progress').style.width = '0%';

                document.getElementById('stage-1-container').classList.remove('hidden');
                document.getElementById('stage-2-container').classList.add('hidden');
                document.getElementById('stage-2-container').classList.remove('flex');

                const topNode = document.getElementById('node-top');
                const leftNode = document.getElementById('node-left');
                const rightNode = document.getElementById('node-right');

                if (this.blankNode === 'top') {
                    topNode.innerHTML = '<input type="number" id="step1-input" readonly class="w-16 h-16 text-center text-3xl font-black text-amber-600 bg-amber-50 rounded-2xl border-2 border-amber-400 focus:outline-none shadow-inner pointer-events-auto" value="" />';
                } else {
                    topNode.innerHTML = `<span class="text-3xl sm:text-4xl font-black text-slate-800 select-none">${this.total}</span>`;
                }

                if (this.blankNode === 'left') {
                    leftNode.innerHTML = '<input type="number" id="step1-input" readonly class="w-14 h-14 text-center text-2xl sm:text-3xl font-black text-amber-600 bg-amber-50 rounded-2xl border-2 border-amber-400 focus:outline-none shadow-inner pointer-events-auto" value="" />';
                } else {
                    leftNode.innerHTML = `<span class="text-2xl sm:text-3xl font-black text-slate-800 select-none">${this.part1}</span>`;
                }

                if (this.blankNode === 'right') {
                    rightNode.innerHTML = '<input type="number" id="step1-input" readonly class="w-14 h-14 text-center text-2xl sm:text-3xl font-black text-amber-600 bg-amber-50 rounded-2xl border-2 border-amber-400 focus:outline-none shadow-inner pointer-events-auto" value="" />';
                } else {
                    rightNode.innerHTML = `<span class="text-2xl sm:text-3xl font-black text-slate-800 select-none">${this.part2}</span>`;
                }
            }

            pressKey(key) {
                sound.playPop();
                const input = document.getElementById('step1-input');
                if (!input) return;

                if (key === 'backspace') {
                    input.value = input.value.slice(0, -1);
                } else {
                    if (input.value.length < 2) {
                        input.value += key;
                    }
                }
            }

            checkStep1Answer() {
                const input = document.getElementById('step1-input');
                if (!input || input.value === '') {
                    this.showFeedback('請先用數字鍵盤輸入波波圖缺少的數字喔！', 'bg-amber-100 text-amber-800 border-2 border-amber-300');
                    return;
                }

                const userVal = parseInt(input.value, 10);
                if (userVal === this.targetAnswer) {
                    sound.playCorrect();
                    this.showFeedback('答對了！波波圖已完整！👏', 'bg-emerald-100 text-emerald-800 border-2 border-emerald-300');
                    
                    const parent = input.parentElement;
                    parent.innerHTML = `<span class="text-3xl sm:text-4xl font-black text-emerald-600 bounce-anim">${userVal}</span>`;

                    setTimeout(() => {
                        this.hideFeedback();
                        this.unlockStage2();
                    }, 1200);
                } else {
                    sound.playWrong();
                    this.showFeedback('再試一次喔！仔細算算分解與合成數 💪', 'bg-rose-100 text-rose-800 border-2 border-rose-300');
                    input.classList.add('animate-bounce');
                    setTimeout(() => input.classList.remove('animate-bounce'), 500);
                }
            }

            unlockStage2() {
                document.getElementById('step2-badge').children[0].className = 'w-10 h-10 rounded-full bg-amber-500 text-white font-black flex items-center justify-center shadow-lg text-lg border-4 border-white';
                document.getElementById('step2-badge').children[1].className = 'text-xs font-bold text-amber-600 mt-1';
                document.getElementById('step-line-progress').style.width = '100%';

                document.getElementById('stage-1-container').classList.add('hidden');
                document.getElementById('stage-2-container').classList.remove('hidden');
                document.getElementById('stage-2-container').classList.add('flex');

                this.renderStage2BubbleDiagram();
                this.resetStage2();
            }

            renderStage2BubbleDiagram() {
                const topNode = document.getElementById('stage2-node-top');
                const leftNode = document.getElementById('stage2-node-left');
                const rightNode = document.getElementById('stage2-node-right');

                topNode.innerText = this.total;
                leftNode.innerText = this.part1;
                rightNode.innerText = this.part2;

                [
                    { elem: topNode, val: this.total, key: 'top' },
                    { elem: leftNode, val: this.part1, key: 'left' },
                    { elem: rightNode, val: this.part2, key: 'right' }
                ].forEach(item => {
                    item.elem.setAttribute('draggable', 'true');
                    
                    item.elem.ontouchstart = () => {
                        if (!this.nodeVisibility[item.key]) return;
                        sound.playPop();
                        this.handleBallClick(item.elem, item.val, item.key);
                    };

                    item.elem.ondragstart = (e) => {
                        if (!this.nodeVisibility[item.key]) {
                            e.preventDefault();
                            return;
                        }
                        e.dataTransfer.setData('text/plain', JSON.stringify({ val: item.val, key: item.key }));
                        item.elem.classList.add('opacity-50', 'dragging');
                        this.selectedBallValue = item.val;
                        this.selectedBallNodeKey = item.key;
                        sound.playPop();
                    };

                    item.elem.ondragend = () => {
                        item.elem.classList.remove('opacity-50', 'dragging');
                    };

                    item.elem.onclick = () => {
                        if (!this.nodeVisibility[item.key]) return;
                        sound.playPop();
                        this.handleBallClick(item.elem, item.val, item.key);
                    };
                });

                this.updateNodeVisibilitiesUI();
            }

            handleBallClick(ball, num, key) {
                document.querySelectorAll('.drag-ball').forEach(b => b.classList.remove('ring-4', 'ring-blue-400', 'scale-110'));
                
                if (this.selectedBallElement === ball) {
                    this.selectedBallValue = null;
                    this.selectedBallElement = null;
                    this.selectedBallNodeKey = null;
                } else {
                    this.selectedBallValue = num;
                    this.selectedBallElement = ball;
                    this.selectedBallNodeKey = key;
                    ball.classList.add('ring-4', 'ring-blue-400', 'scale-110');
                }
            }

            hideNode(key) {
                this.nodeVisibility[key] = false;
                this.updateNodeVisibilitiesUI();
            }

            showNode(key) {
                this.nodeVisibility[key] = true;
                this.updateNodeVisibilitiesUI();
            }

            showAllNodes() {
                this.nodeVisibility = { top: true, left: true, right: true };
                this.updateNodeVisibilitiesUI();
            }

            updateNodeVisibilitiesUI() {
                ['top', 'left', 'right'].forEach(key => {
                    const elem = document.getElementById(`stage2-node-${key}`);
                    if (elem) {
                        if (this.nodeVisibility[key]) {
                            elem.classList.remove('opacity-0', 'pointer-events-none', 'scale-0');
                            elem.classList.add('opacity-100', 'scale-100');
                        } else {
                            elem.classList.add('opacity-0', 'pointer-events-none', 'scale-0');
                            elem.classList.remove('opacity-100', 'scale-100');
                        }
                    }
                });
            }

            setupDropZoneEvents() {
                const dropZones = document.querySelectorAll('.drop-zone');

                dropZones.forEach(zone => {
                    zone.addEventListener('dragover', (e) => {
                        e.preventDefault();
                        zone.classList.add('drag-over');
                    });

                    zone.addEventListener('dragleave', () => {
                        zone.classList.remove('drag-over');
                    });

                    zone.addEventListener('drop', (e) => {
                        e.preventDefault();
                        zone.classList.remove('drag-over');
                        const dataStr = e.dataTransfer.getData('text/plain');
                        if (dataStr) {
                            try {
                                const data = JSON.parse(dataStr);
                                this.placeValueInZone(zone, data.val, data.key);
                            } catch(err) {}
                        }
                    });

                    zone.addEventListener('click', () => {
                        if (this.selectedBallValue !== null && this.selectedBallNodeKey !== null) {
                            this.placeValueInZone(zone, this.selectedBallValue, this.selectedBallNodeKey);
                            if (this.selectedBallElement) {
                                this.selectedBallElement.classList.remove('ring-4', 'ring-blue-400', 'scale-110');
                                this.selectedBallElement = null;
                                this.selectedBallValue = null;
                                this.selectedBallNodeKey = null;
                            }
                        } else if (zone.innerText !== '') {
                            this.clearZone(zone);
                        }
                    });
                });
            }

            placeValueInZone(zone, val, nodeKey) {
                const eqType = zone.dataset.eq;
                const slotIdx = parseInt(zone.dataset.slot, 10);

                if (this.equationState[eqType][slotIdx]) {
                    const prevNodeKey = this.equationState[eqType][slotIdx].nodeKey;
                    if (prevNodeKey) this.showNode(prevNodeKey);
                }

                this.equationState[eqType][slotIdx] = { val: val, nodeKey: nodeKey };
                zone.innerText = val;
                zone.classList.add('bg-amber-100', 'border-amber-400', 'bounce-anim');
                sound.playPop();

                if (nodeKey) {
                    this.hideNode(nodeKey);
                }

                setTimeout(() => zone.classList.remove('bounce-anim'), 300);
            }

            clearZone(zone) {
                const eqType = zone.dataset.eq;
                const slotIdx = parseInt(zone.dataset.slot, 10);

                if (this.equationState[eqType][slotIdx]) {
                    const nodeKey = this.equationState[eqType][slotIdx].nodeKey;
                    if (nodeKey) this.showNode(nodeKey);
                }

                this.equationState[eqType][slotIdx] = null;
                zone.innerText = '';
                zone.classList.remove('bg-amber-100', 'border-amber-400');
                sound.playPop();
            }

            clearEquation(eqType) {
                sound.playPop();
                this.equationState[eqType].forEach((item) => {
                    if (item && item.nodeKey) {
                        this.showNode(item.nodeKey);
                    }
                });

                this.equationState[eqType] = [null, null, null];
                if (eqType === 'add') this.isAddCompleted = false;
                if (eqType === 'sub') this.isSubCompleted = false;

                document.querySelectorAll(`.drop-zone[data-eq="${eqType}"]`).forEach(zone => {
                    zone.innerText = '';
                    zone.classList.remove('bg-amber-100', 'border-amber-400', 'bg-emerald-100', 'border-emerald-500');
                });

                const badge = document.getElementById(`badge-${eqType}`);
                badge.innerText = '未完成';
                badge.className = 'text-xs font-bold text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full';

                const box = document.getElementById(`box-${eqType}`);
                box.classList.remove('border-emerald-500', 'bg-emerald-50/60');
            }

            resetStage2() {
                this.equationState = {
                    add: [null, null, null],
                    sub: [null, null, null]
                };
                this.isAddCompleted = false;
                this.isSubCompleted = false;

                this.clearEquation('add');
                this.clearEquation('sub');
                this.showAllNodes();

                if (this.selectedBallElement) {
                    this.selectedBallElement.classList.remove('ring-4', 'ring-blue-400', 'scale-110');
                    this.selectedBallElement = null;
                    this.selectedBallValue = null;
                    this.selectedBallNodeKey = null;
                }
            }

            checkAdditionAnswer() {
                const addItems = this.equationState.add;

                if (addItems.includes(null)) {
                    this.showFeedback('加法算式尚未填滿喔！', 'bg-amber-100 text-amber-800 border-2 border-amber-300');
                    return;
                }

                const addVals = addItems.map(item => item.val);

                const isAddValid = (addVals[0] + addVals[1] === addVals[2]) &&
                                   ((addVals[0] === this.part1 && addVals[1] === this.part2 && addVals[2] === this.total) ||
                                    (addVals[0] === this.part2 && addVals[1] === this.part1 && addVals[2] === this.total));

                if (isAddValid) {
                    sound.playCorrect();
                    this.isAddCompleted = true;

                    const badge = document.getElementById('badge-add');
                    badge.innerText = '正確 ✔';
                    badge.className = 'text-xs font-black text-emerald-700 bg-emerald-200 px-2.5 py-0.5 rounded-full';

                    const box = document.getElementById('box-add');
                    box.classList.add('border-emerald-500', 'bg-emerald-50/60');

                    this.showAllNodes();
                    this.showFeedback('加法算式完全正確！3個波波數字已重新出現，請繼續組減法算式！👍', 'bg-emerald-100 text-emerald-800 border-2 border-emerald-300');
                    this.checkOverallCompletion();
                } else {
                    sound.playWrong();
                    this.showFeedback('加法算式不對喔！提示：兩個分解數相加等於頂部的合成數。', 'bg-rose-100 text-rose-800 border-2 border-rose-300');
                }
            }

            checkSubtractionAnswer() {
                const subItems = this.equationState.sub;

                if (subItems.includes(null)) {
                    this.showFeedback('減法算式尚未填滿喔！', 'bg-amber-100 text-amber-800 border-2 border-amber-300');
                    return;
                }

                const subVals = subItems.map(item => item.val);

                const isSubValid = (subVals[0] - subVals[1] === subVals[2]) &&
                                   (subVals[0] === this.total) &&
                                   ((subVals[1] === this.part1 && subVals[2] === this.part2) ||
                                    (subVals[1] === this.part2 && subVals[2] === this.part1));

                if (isSubValid) {
                    sound.playCorrect();
                    this.isSubCompleted = true;

                    const badge = document.getElementById('badge-sub');
                    badge.innerText = '正確 ✔';
                    badge.className = 'text-xs font-black text-emerald-700 bg-emerald-200 px-2.5 py-0.5 rounded-full';

                    const box = document.getElementById('box-sub');
                    box.classList.add('border-emerald-500', 'bg-emerald-50/60');

                    this.showAllNodes();
                    this.showFeedback('減法算式完全正確！👍', 'bg-emerald-100 text-emerald-800 border-2 border-emerald-300');
                    this.checkOverallCompletion();
                } else {
                    sound.playWrong();
                    this.showFeedback('減法算式不對喔！提示：用頂部的總數減去其中一個分解數。', 'bg-rose-100 text-rose-800 border-2 border-rose-300');
                }
            }

            checkOverallCompletion() {
                if (this.isAddCompleted && this.isSubCompleted) {
                    setTimeout(() => {
                        sound.playCorrect();
                        this.score += 10;
                        document.getElementById('score-text').innerText = this.score;
                        document.getElementById('modal-score').innerText = this.score;

                        if (typeof confetti === 'function') {
                            confetti({
                                particleCount: 120,
                                spread: 80,
                                origin: { y: 0.6 }
                            });
                        }

                        document.getElementById('victory-modal').classList.remove('hidden');
                    }, 500);
                }
            }

            nextQuestion() {
                document.getElementById('victory-modal').classList.add('hidden');
                this.hideFeedback();
                this.generateQuestion();
                this.renderStage1();
            }

            showFeedback(msg, styleClass) {
                const banner = document.getElementById('feedback-banner');
                const text = document.getElementById('feedback-text');

                text.innerText = msg;
                banner.className = `fixed bottom-4 left-1/2 -translate-x-1/2 w-11/12 max-w-md p-3.5 rounded-2xl shadow-xl text-center font-black text-xs sm:text-sm transition-all duration-300 z-40 ${styleClass}`;
                banner.classList.remove('hidden');
            }

            hideFeedback() {
                const banner = document.getElementById('feedback-banner');
                banner.classList.add('hidden');
            }
        }

        let game = null;
        window.addEventListener('load', () => {
            game = new NumberBondGame();
        });
    </script>
</body>
</html>
